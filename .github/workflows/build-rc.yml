name: Build RC Release

on:
  push:
    branches:
      - 'feature/**'

jobs:
  build-rc:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Get latest RC version
      id: get_version
      run: |
        # Get latest release tags
        LATEST_RC=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases" | jq -r '[.[] | select(.tag_name | test("v[0-9]+\\.[0-9]+\\.[0-9]+-rc\\.[0-9]+")) | .tag_name] | .[0] // empty')
        
        if [ -z "$LATEST_RC" ]; then
          # No RC found, start with rc.1
          NEW_RC="v1.0.1-rc.1"
        else
          # Extract RC number and increment
          RC_NUM=$(echo $LATEST_RC | grep -o 'rc\.\([0-9]\+\)' | grep -o '[0-9]\+')
          NEW_RC_NUM=$((RC_NUM + 1))
          NEW_RC="v1.0.1-rc.$NEW_RC_NUM"
        fi
        
        echo "new_rc=$NEW_RC" >> $GITHUB_OUTPUT
        echo "Creating RC version: $NEW_RC"
    
    - name: Create archive
      run: |
        # Create a directory with the extension name
        mkdir -p lnpos_extension
        
        # Copy all files except .git, .github, and other build artifacts
        rsync -av --exclude='.git' --exclude='.github' --exclude='*.zip' --exclude='__pycache__' --exclude='*.pyc' . lnpos_extension/
        
        # Create the zip archive
        zip -r lnpos_extension-${{ steps.get_version.outputs.new_rc }}.zip lnpos_extension/
        
        # Verify archive contents
        echo "Archive contents:"
        unzip -l lnpos_extension-${{ steps.get_version.outputs.new_rc }}.zip
    
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.get_version.outputs.new_rc }}
        release_name: Release ${{ steps.get_version.outputs.new_rc }}
        body: |
          Release Candidate ${{ steps.get_version.outputs.new_rc }}
          
          Auto-generated RC build from feature branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          
          Created by Cursor-MCP-MAF automation
          
          **Manual registry update required**
        draft: false
        prerelease: true
    
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./lnpos_extension-${{ steps.get_version.outputs.new_rc }}.zip
        asset_name: lnpos_extension-${{ steps.get_version.outputs.new_rc }}.zip
        asset_content_type: application/zip 