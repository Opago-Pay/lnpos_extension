name: Build RC Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-rc:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f "pyproject.toml" ]; then
          pip install poetry
          poetry install --only dev || echo "No dev dependencies configured"
        fi
        
    - name: Run tests (if configured)
      run: |
        if [ -f "pyproject.toml" ] && command -v poetry &> /dev/null; then
          poetry run pytest || echo "Tests not configured or failed - continuing"
        else
          echo "No test configuration found - skipping tests"
        fi
        
    - name: Get latest RC tag
      id: get_tag
      run: |
        # Get the latest tag that matches the v1.0.1-rc.* pattern
        LATEST_RC=$(git tag -l "v1.0.1-rc.*" | sort -V | tail -1)
        
        if [ -z "$LATEST_RC" ]; then
          # No RC tags exist, start with rc.1
          NEW_TAG="v1.0.1-rc.1"
        else
          # Extract RC number and increment
          RC_NUM=$(echo $LATEST_RC | sed 's/v1\.0\.1-rc\.//')
          NEW_RC_NUM=$((RC_NUM + 1))
          NEW_TAG="v1.0.1-rc.$NEW_RC_NUM"
        fi
        
        echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
        echo "Creating new RC tag: $NEW_TAG"
        
    - name: Create and push RC tag
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag -a ${{ steps.get_tag.outputs.new_tag }} -m "Release candidate ${{ steps.get_tag.outputs.new_tag }} - Created by Cursor-MCP-MAF"
        git push origin ${{ steps.get_tag.outputs.new_tag }}
        
    - name: Create release archive
      run: |
        # Create a clean archive excluding development files
        mkdir -p release-temp
        
        # Copy all files except those we want to exclude
        rsync -av --progress . release-temp/ \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='node_modules' \
          --exclude='__pycache__' \
          --exclude='*.pyc' \
          --exclude='.pytest_cache' \
          --exclude='.coverage' \
          --exclude='dist' \
          --exclude='build' \
          --exclude='.env' \
          --exclude='release-temp'
          
        # Create the archive
        cd release-temp
        zip -r ../lnpos_extension-${{ steps.get_tag.outputs.new_tag }}.zip .
        cd ..
        
        # Clean up
        rm -rf release-temp
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_tag.outputs.new_tag }}
        name: "LNPoS Extension ${{ steps.get_tag.outputs.new_tag }}"
        body: |
          ## LNPoS Extension Release Candidate ${{ steps.get_tag.outputs.new_tag }}
          
          **Created by Cursor-MCP-MAF**
          
          ### Changes in this RC:
          - ✅ Enhanced extra_json storage with nested "pos" structure
          - ✅ Tax compliance: Store requested fiat amount and currency (addresses [lnbits/lnpos_extension#8](https://github.com/lnbits/lnpos_extension/issues/8))
          - ✅ Improved payment metadata for German/EU tax requirements
          - ✅ Automatic RC build and release workflow
          
          ### Tax Compliance Features:
          - Stores exact amount entered on device (not just converted amount)
          - Stores currency used on device (important when device currency differs from wallet)
          - Enables proper tax reporting for EU businesses
          
          ### Extra JSON Structure:
          ```json
          {
            "tag": "PoS",
            "pos": {
              "callback_url": "https://domain.com/lnpos/displaypin/payment123",
              "pin": 1234,
              "pos_id": "abc123", 
              "requested_amount": 15.50,
              "requested_currency": "EUR"
            }
          }
          ```
          
          ### Installation:
          This release candidate can be installed in LNbits via the extension management interface.
          
          **Note**: This is a release candidate for testing purposes. Use in production at your own risk.
          
        files: lnpos_extension-${{ steps.get_tag.outputs.new_tag }}.zip
        prerelease: true
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 